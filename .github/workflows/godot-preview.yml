name: Godot mobile web preview
on:
  push:
    branches: [main]
    paths:
      - 'godot/**'
      - '.github/workflows/godot-preview.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.4.1 and web templates
        run: |
          set -e
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.4.1-stable_linux.x86_64.zip
          chmod +x Godot_v4.4.1-stable_linux.x86_64
          sudo mv Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.4.1.stable
          unzip -q Godot_v4.4.1-stable_export_templates.tpz
          cp -r templates/. ~/.local/share/godot/export_templates/4.4.1.stable/
      - name: Import resources and validate scripts
        run: |
          godot --headless --path godot --editor --import --quit 2>&1 | tee /tmp/realm-import.log
          godot --headless --path godot --quit-after 5 2>&1 | tee /tmp/realm-run.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" /tmp/realm-import.log /tmp/realm-run.log; then
            echo "Godot script errors detected"; exit 1
          fi
      - name: Publish validation diagnostics on failure
        if: failure()
        run: |
          {
            echo "# Godot validation diagnostics"
            echo "Commit: $GITHUB_SHA"
            echo "Run: $GITHUB_RUN_ID"
            echo
            echo "## Import"
            cat /tmp/realm-import.log 2>/dev/null || true
            echo
            echo "## Runtime"
            cat /tmp/realm-run.log 2>/dev/null || true
          } > godot-diagnostics.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add godot-diagnostics.txt
          git commit -m "ci: capture Godot validation errors [skip ci]" || true
          git pull --rebase origin main || true
          git push origin HEAD:main || true
      - name: Export Web
        run: |
          mkdir -p godot-preview
          godot --headless --path godot --export-release Web ../godot-preview/index.html
          touch godot-preview/.nojekyll
          python3 - <<'PY'
          from pathlib import Path
          p=Path("godot-preview/index.html")
          html=p.read_text()
          overlay='<div id="realm-debug" style="position:fixed;bottom:10px;left:10px;right:10px;z-index:9999;background:#152a37;color:#ffe1a0;padding:12px;border:1px solid #b98d50;border-radius:10px;font:14px sans-serif;display:none"></div><script>window.addEventListener("error",function(e){var d=document.getElementById("realm-debug");if(d){d.style.display="block";d.textContent="REALM ERROR: "+e.message}});window.addEventListener("unhandledrejection",function(e){var d=document.getElementById("realm-debug");if(d){d.style.display="block";d.textContent="REALM ERROR: "+String(e.reason)}});</script>'
          p.write_text(html.replace("</body>",overlay+"</body>"))
          PY
      - name: Upload playable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: realm-of-fortune-godot-web
          path: godot-preview/
      - name: Publish preview into existing GitHub Pages folder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f godot-preview/
          if ! git diff --cached --quiet; then
            git commit -m "build: publish Godot preview [skip ci]"
            git push
          fi
